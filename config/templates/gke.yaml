# Your installation. Created by: task config:init PROFILE=gke
# Everything about GKE as a KIND of cluster -- storage classes, edge types,
# ingress class, load balancer annotations -- is in profiles/gke.yaml.
# The cluster itself comes from terraform/gke/. Fill the empty values; `task validate`
# names any you miss.
global:
  certManager:
    email: ""                  # e.g. admin@yourdomain.com
    installClusterIssuer: true # false if your cluster already has one
  panel:
    panelHost: ""              # e.g. panel.yourdomain.com
  ingress:
    host: ""                   # must match panelHost

  storage:
    # false skips ReadWriteMany entirely: no persistent deployments, and this
    # profile's RWX storage can go (see terraform/gke/).
    persistentDeployments: true

  # false makes instances mount the shared volume instead of pulling published
  # artifacts. That needs storage.classes.shared.accessMode: ReadWriteMany,
  # which profiles/gke.yaml does not set -- the schema will say so.
  artifactStore:
    enabled: true

  # Switching topology later is not a migration -- the old mode's volumes are
  # stranded and BMC starts on an empty database.
  mariaDB:
    mode: single
  mongoDB:
    mode: single
  redis:
    mode: single

  edge:
    game:
      # Unlike AWS, GCP honours this. Reserve a regional static address in
      # Terraform and set it here to keep the game address stable across
      # cluster rebuilds. Empty lets GCP allocate one.
      loadBalancerIP: ""
