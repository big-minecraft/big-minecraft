# Your installation. Created by: task config:init PROFILE=eks
# Cluster-kind settings live in profiles/eks.yaml; the cluster comes from
# terraform/eks/. Fill the empty values; `task validate` names any you miss.
global:
  certManager:
    email: ""                  # e.g. admin@yourdomain.com
    installClusterIssuer: true # false if your cluster already has one
  panel:
    panelHost: ""              # e.g. panel.yourdomain.com
  ingress:
    host: ""                   # must match panelHost
    controller:
      # Point DNS here before `task install`. Both lists must be the same length:
      #   cd terraform/eks && tofu output ingress_eip_allocation_ids edge_subnet_ids
      service:
        eipAllocations: []
        subnets: []
      mode: single             # single | ha -- safe to change later
      replicas: 3              # 'ha' only, 2 or more

  storage:
    # false disables persistent deployments and the RWX storage they need.
    persistentDeployments: true

  artifactStore:
    # false mounts the shared volume instead, which needs RWX shared storage.
    enabled: true

  sftp:
    # Password login for SFTP file sessions. false leaves SSH keys as the only
    # way in.
    passwordAuth: true

  # Switching mode later strands the old volumes.
  mariaDB:
    mode: single
    replicas: 3              # 'ha' only, 3 or more (odd -- Galera needs quorum)
  mongoDB:
    mode: single
    replicas: 3              # 'ha' only, 3 or more (odd -- the replica set elects)
  redis:
    mode: single
    replicas: 3              # 'ha' only, 3 or more

  edge:
    game:
      # Both lists must be the same length:
      #   cd terraform/eks && tofu output game_eip_allocation_ids edge_subnet_ids
      eipAllocations: []
      subnets: []
