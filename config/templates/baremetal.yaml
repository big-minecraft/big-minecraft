# Your installation. Created by: task config:init PROFILE=baremetal
# Everything about bare metal as a KIND of cluster is in profiles/baremetal.yaml.
# Fill the empty values; `task validate` names any you miss.
global:
  certManager:
    email: ""                  # e.g. admin@yourdomain.com
    installClusterIssuer: true # false if your cluster already has one
  panel:
    panelHost: ""              # e.g. panel.yourdomain.com
  ingress:
    host: ""                   # must match panelHost

  storage:
    # false skips ReadWriteMany entirely; 'persistent' below is then unused.
    persistentDeployments: true
    # What `task cluster PROFILE=baremetal` installs. Change all three if you
    # brought your own storage; `persistent` must be ReadWriteMany.
    classes:
      shared:
        name: "longhorn"
      database:
        name: "longhorn"
      persistent:
        name: "longhorn"

  # false makes instances mount the shared volume instead of pulling published
  # artifacts, and needs storage.classes.shared.accessMode: ReadWriteMany.
  artifactStore:
    enabled: true

  # Switching topology later is not a migration -- the old mode's volumes are
  # stranded and BMC starts on an empty database.
  mariaDB:
    mode: single
  mongoDB:
    mode: single
  redis:
    mode: single

  edge:
    game:
      # Local makes the server see real player IPs, which per-player bans and
      # rate limits need. Under k3s servicelb this is the only thing that
      # decides it, at the cost of only answering on nodes running a proxy pod.
      externalTrafficPolicy: Cluster
