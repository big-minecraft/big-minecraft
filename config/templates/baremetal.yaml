# Your installation. Created by: task config:init PROFILE=baremetal
# Everything about bare metal as a KIND of cluster is in profiles/baremetal.yaml.
# Fill the empty values; `task validate` names any you miss.
global:
  certManager:
    email: ""                  # e.g. admin@yourdomain.com
    installClusterIssuer: true # false if your cluster already has one
  panel:
    panelHost: ""              # e.g. panel.yourdomain.com

  # Single sign-on, optional. Everything below comes from your provider.
  oidc:
    enabled: false
    displayName: ""            # name on the login button, e.g. authentik
    issuer: ""                 # e.g. https://auth.yourdomain.com/application/o/bmc-panel/
    clientId: ""
    clientSecret: ""           # a secret in a plain file -- keep this file private
    scopes: "openid profile email groups"
    allowedGroup: ""           # group required to sign in; empty admits anyone
    adminGroup: ""             # group granted panel admin; empty grants no one
    autoCreateUsers: true      # make an account on first login, no invite needed
    allowLocalLogin: true      # false removes password login -- SSO or nothing

  ingress:
    host: ""                   # must match panelHost

  storage:
    # false skips ReadWriteMany entirely; 'persistent' below is then unused.
    persistentDeployments: true
    # What `task cluster` installs. `persistent` must be ReadWriteMany.
    classes:
      shared:
        name: "longhorn"
      database:
        name: "longhorn"
      persistent:
        name: "longhorn"

  # false mounts the shared volume instead, which needs RWX shared storage.
  artifactStore:
    enabled: true

  sftp:
    # Password login for SFTP file sessions. false leaves SSH keys as the only
    # way in.
    passwordAuth: true

  # Switching mode later strands the old volumes.
  mariaDB:
    mode: single
    replicas: 3              # 'ha' only, 3 or more (odd -- Galera needs quorum)
  mongoDB:
    mode: single
    replicas: 3              # 'ha' only, 3 or more (odd -- the replica set elects)
  redis:
    mode: single
    replicas: 3              # 'ha' only, 3 or more

  edge:
    game:
      # Local makes the server see real player IPs, but only answers on nodes
      # running a proxy pod.
      externalTrafficPolicy: Cluster
