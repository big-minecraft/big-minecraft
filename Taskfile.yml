version: '3'

vars:
  CHART_DIR: charts/bmc-chart
  # One file per profile, so switching clusters does not clobber the last one.
  CONFIG_DIR: config
  # What builds the cluster, kept apart from what configures BMC on it.
  INFRA_DIR: config/infrastructure
  # Fallback keeps a machine with no yq able to run `task verify`. The `tr`
  # normalises the Python yq, which emits JSON.
  NAMESPACE:
    sh: '{ yq ".global.namespace" {{.CHART_DIR}}/values.yaml 2>/dev/null || echo bmc; } | tr -d ''"'''
  SCRIPTS_DIR: scripts
  # See profiles/. No default -- a fallback would let `task teardown` act on
  # the wrong cluster.
  PROFILE: '{{.PROFILE}}'
  # Terraform root for this profile. Anchored to the Taskfile so it does not
  # resolve against the invocation directory.
  # The cluster's own name, for cleanup that has to run after its API is gone.
  # tfvars is the source of truth; the fallback matches variables.tf's default.
  CLUSTER_NAME:
    sh: 'sed -n ''s/^cluster_name *= *"\(.*\)"/\1/p'' {{.ROOT_DIR}}/terraform/eks/terraform.tfvars 2>/dev/null | head -1 | grep . || echo bmc'
  TF_DIR: '{{.ROOT_DIR}}/terraform/{{if eq .PROFILE "eks"}}eks{{else if eq .PROFILE "gke"}}gke{{else if eq .PROFILE "aks"}}aks{{else}}none{{end}}'

env:
  # helmfile reads this to pick the profile layer.
  PROFILE: '{{.PROFILE}}'

tasks:
  _require-profile:
    internal: true
    silent: true
    cmds:
      - |
        if [ -z "{{.PROFILE}}" ]; then
          echo ""
          echo "PROFILE is required."
          echo ""
          # NOT {{.TASK}}: this runs as a subtask, so that resolves to
          # _require-profile rather than whatever the user actually typed.
          echo "  Per command:  task <command> PROFILE=<profile>"
          echo "  Or exported:  export PROFILE=<profile>"
          echo ""
          echo "  Available:"
          for f in {{.ROOT_DIR}}/profiles/*.yaml; do
            echo "    $(basename "$f" .yaml)"
          done
          echo ""
          exit 1
        fi
        if [ ! -f "{{.ROOT_DIR}}/profiles/{{.PROFILE}}.yaml" ]; then
          echo ""
          echo "Unknown profile '{{.PROFILE}}' -- no profiles/{{.PROFILE}}.yaml"
          echo ""
          echo "  Available:"
          for f in {{.ROOT_DIR}}/profiles/*.yaml; do
            echo "    $(basename "$f" .yaml)"
          done
          echo ""
          exit 1
        fi

  install:
    desc: Complete installation (verify, validate, storage, preflight, deploy)
    silent: true
    cmds:
      - task: _require-profile
      - task: verify
      # Before storage: storage installs MinIO, which mounts bmc-secrets, so
      # without this the failure is five minutes deep in a Helm timeout instead
      # of a one-second "run task secrets:generate".
      - task: secrets:check
      # First: validate is the only task that names `task config:init` when
      # the gitignored config/PROFILE.yaml is missing.
      - task: validate
      # Before preflight, whose shared-storage probe needs the storage class.
      - task: storage
      # preflight provisions a REAL LoadBalancer Service, so this reports
      # whether anything is able to answer it before that check runs. Nothing
      # is installed here on any profile any more -- see the task itself.
      - task: edge
      - task: preflight
      - echo ""
      - echo "=========================================="
      - echo "Ready to deploy BMC to Kubernetes"
      - 'echo "  profile:   {{.PROFILE}}"'
      - 'echo "  namespace: {{.NAMESPACE}}"'
      - echo "=========================================="
      - echo ""
      - task: deploy
      - task: wait-for-webhooks
      - task: deploy-bmc
      - task: wait-for-panel

  preflight:
    desc: Verify the cluster satisfies the capability contract
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} CHART_DIR={{.CHART_DIR}} {{.SCRIPTS_DIR}}/preflight.sh

  conformance:
    desc: Render every profile and check the cluster against the contract
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} CHART_DIR={{.CHART_DIR}} {{.SCRIPTS_DIR}}/conformance.sh

  validate:
    desc: Validate required configuration values
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} {{.SCRIPTS_DIR}}/validate-config.sh

  sftp:info:
    desc: Print connection details for open SFTP / file-edit sessions
    silent: true
    cmds:
      - NAMESPACE={{.NAMESPACE}} {{.SCRIPTS_DIR}}/sftp-info.sh

  secrets:check:
    desc: Check if secrets exist in cluster
    silent: true
    cmds:
      - NAMESPACE={{.NAMESPACE}} {{.SCRIPTS_DIR}}/check-secrets.sh

  secrets:generate:
    desc: Generate and create Kubernetes secrets
    prompt: This will create secrets in the '{{.NAMESPACE}}' namespace. Continue?
    silent: true
    cmds:
      - NAMESPACE={{.NAMESPACE}} {{.SCRIPTS_DIR}}/generate-secrets.sh

  config:init:
    desc: Create config/PROFILE.yaml from that profile's template
    silent: true
    cmds:
      - task: _require-profile
      - |
        CONFIG={{.CONFIG_DIR}}/{{.PROFILE}}.yaml

        if [ -f "$CONFIG" ]; then
          echo "⚠️  $CONFIG already exists!"
          echo "   Edit it directly, or delete it to start over."
          exit 1
        fi

        TEMPLATE={{.CONFIG_DIR}}/templates/{{.PROFILE}}.yaml
        if [ ! -f "$TEMPLATE" ]; then
          echo "✗ No template for profile '{{.PROFILE}}': $TEMPLATE"
          echo "   A profile needs one; conformance.sh checks for it."
          exit 1
        fi

        mkdir -p {{.CONFIG_DIR}}
        cp "$TEMPLATE" "$CONFIG"
        echo "✓ Created $CONFIG from $(basename "$TEMPLATE")"
        echo ""
        echo "Next steps:"
        echo "  1. Edit $CONFIG -- fill every empty value"
        echo "  2. Run 'task validate PROFILE={{.PROFILE}}' to check it"
        echo "  3. Run 'task secrets:generate' to create secrets"
        echo "  4. Run 'task install PROFILE={{.PROFILE}}' to deploy"

  cluster:
    desc: Build the cluster for PROFILE (cloud via OpenTofu, bare metal via Ansible)
    silent: true
    cmds:
      - task: _require-profile
      - task: cluster:init
      - |
        case "{{.PROFILE}}" in
          eks|gke|aks)
            # A fresh clone has the lock file but no providers, and apply's
            # error for that reads like a version conflict.
            cd {{.TF_DIR}} && tofu init -input=false
            cd {{.TF_DIR}} && tofu apply -var-file={{.ROOT_DIR}}/{{.INFRA_DIR}}/{{.PROFILE}}.tfvars

            # Restate the two outputs that block the next step.
            PANEL=$(cd {{.TF_DIR}} && tofu output -json panel_dns_records 2>/dev/null)
            GAME=$(cd {{.TF_DIR}} && tofu output -json game_dns_records 2>/dev/null)
            fmt() { printf '%s' "$1" | tr -d '[]"' | tr ',' '\n' | sed '/^$/d' | sed 's/^/       /'; }
            echo ""
            echo "=========================================="
            echo "Point DNS at these, THEN run task install"
            echo "=========================================="
            echo ""
            echo "  Panel  ({{.PROFILE}})  ->  A records for your panel host:"
            fmt "$PANEL"
            echo ""
            echo "  Game            ->  A records for the address players use:"
            fmt "$GAME"
            echo ""
            echo "  These are reserved and will not change on reinstall."
            echo ""
            echo "  Put them in config/{{.PROFILE}}.yaml as well -- the load"
            echo "  balancers only attach an address they are told to use:"
            if [ "{{.PROFILE}}" = "eks" ]; then
              echo "    global.ingress.controller.service.eipAllocations + subnets"
              echo "    global.edge.game.eipAllocations + subnets"
              echo "  (allocation ids and subnet ids, not addresses:"
              echo "     cd {{.TF_DIR}} && tofu output \\"
              echo "       ingress_eip_allocation_ids game_eip_allocation_ids edge_subnet_ids)"
            else
              echo "    global.ingress.controller.service.loadBalancerIP"
              echo "    global.edge.game.loadBalancerIP"
            fi
            echo ""
            echo "  cert-manager validates over HTTP-01 against the panel host,"
            echo "  so DNS must resolve before task install -- otherwise the"
            echo "  first certificate fails and cert-manager backs off an hour."
            echo ""
            ;;
          baremetal)
            # A YAML error here makes Ansible fall back to implicit localhost
            # and report an empty k3s_servers group, which misleads.
            INV={{.ROOT_DIR}}/{{.INFRA_DIR}}/baremetal.inventory.yml
            if ! yq '.' "$INV" >/dev/null 2>&1; then
              echo ""
              echo "✗ $INV is not valid YAML:"
              echo ""
              yq '.' "$INV" 2>&1 | head -5 | sed 's/^/    /'
              echo ""
              echo "  A common cause is writing 'hosts: {}' and then indenting"
              echo "  hosts under it -- the {} closes the mapping. Use a bare"
              echo "  'hosts:' instead."
              exit 1
            fi

            cd {{.ROOT_DIR}}/ansible && ansible-playbook site.yml -i "$INV"
            ;;
          *)
            echo "Profile '{{.PROFILE}}' brings its own cluster -- nothing to build."
            echo "Point kubectl at it, then run: task preflight PROFILE={{.PROFILE}}"
            ;;
        esac

  cluster:init:
    desc: Create the cluster config for PROFILE, and stop so you can edit it
    silent: true
    cmds:
      - task: _require-profile
      - |
        # A gate, not a prompt: an unedited config cannot build a cluster (no
        # project, no subscription, no host addresses), and a prompt here would
        # make the whole flow unscriptable. Stopping with the path is
        # re-runnable and impossible to blunder past.
        case "{{.PROFILE}}" in
          eks|gke|aks)
            TARGET={{.INFRA_DIR}}/{{.PROFILE}}.tfvars
            TEMPLATE={{.TF_DIR}}/terraform.tfvars.example
            WHAT="infrastructure variables"
            ;;
          baremetal)
            TARGET={{.INFRA_DIR}}/baremetal.inventory.yml
            TEMPLATE={{.ROOT_DIR}}/ansible/inventory.example.yml
            WHAT="inventory (the machines to build on)"
            ;;
          *)
            exit 0
            ;;
        esac

        if [ -f "$TARGET" ]; then
          exit 0
        fi

        mkdir -p {{.INFRA_DIR}}
        cp "$TEMPLATE" "$TARGET"
        echo ""
        echo "=========================================="
        echo "Created $TARGET"
        echo "=========================================="
        echo "This is your $WHAT, and it cannot build anything unedited."
        echo ""
        echo "  1. Edit $TARGET (every line marked CHANGE THIS)"
        echo "  2. Run 'task cluster PROFILE={{.PROFILE}}' again to build"
        echo ""
        exit 1

  storage:
    desc: Install the in-cluster storage provider, if this profile uses one
    silent: true
    cmds:
      - task: _require-profile
      - |
        echo "Installing storage provider (no-op unless the profile enables one)..."
      - helmfile apply --selector name=nfs-server-provisioner
      - helmfile apply --selector name=redis-operator
      - helmfile apply --selector name=mariadb-operator
      - helmfile apply --selector name=mongodb-operator
      - helmfile apply --selector name=minio

  # BMC installs no LoadBalancer provider: k3s has servicelb built in, and the
  # clouds get the provider's controller from the Terraform layer.
  edge:
    desc: Report where LoadBalancer addresses come from for this profile
    silent: true
    cmds:
      - task: _require-profile
      - |
        case "{{.PROFILE}}" in
          baremetal)
            echo "LoadBalancer provider: k3s servicelb (built in) -- nothing to install."
            if kubectl get ds -n kube-system -o name 2>/dev/null | grep -q svclb; then
              echo "  ✓ servicelb is running (svclb DaemonSet present)"
            else
              echo "  ⚠ no svclb DaemonSet yet -- it appears with the first"
              echo "    LoadBalancer Service. If none ever appears, this k3s was"
              echo "    started with --disable servicelb and no LoadBalancer will"
              echo "    get an address."
            fi
            ;;
          *)
            echo "LoadBalancer provider: supplied by the cloud -- nothing to install."
            ;;
        esac

  deploy:
    desc: Deploy dependencies (ingress controller, cert-manager, per profile)
    silent: true
    cmds:
      - task: _require-profile
      - echo "Installing profile dependencies..."
      # A release not named here is never installed, whatever `needs:` says --
      # helmfile only walks needs with --include-needs.
      - helmfile apply --selector name=traefik
      - helmfile apply --selector name=cert-manager

  wait-for-webhooks:
    desc: Wait for cert-manager's webhook to be ready
    silent: true
    cmds:
      - "{{.SCRIPTS_DIR}}/wait-for-webhooks.sh"

  deploy-bmc:
    desc: Deploy big-minecraft chart
    silent: true
    cmds:
      - task: _require-profile
      # The chart that actually creates the datastores, so this is the last
      # place a mode change can be caught. install and upgrade both validate
      # before reaching here; running this standalone would otherwise skip it.
      - task: validate
      - echo "=========================================="
      - echo "Deploying BMC..."
      - echo "=========================================="
      - helmfile apply --selector name=big-minecraft

  wait-for-panel:
    desc: Wait until the panel is serving, then print its URL
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} NAMESPACE={{.NAMESPACE}} CHART_DIR={{.CHART_DIR}} CONFIG_DIR={{.CONFIG_DIR}} {{.SCRIPTS_DIR}}/wait-for-panel.sh

  upgrade:
    desc: Upgrade existing BMC installation
    cmds:
      - task: _require-profile
      - task: preflight
      # preflight asks whether the cluster can run BMC; validate asks whether
      # this config is safe to apply to it -- where a datastore mode change is
      # caught. Upgrade is the likelier path for that, not install.
      - task: validate
      - helmfile apply

  diff:
    desc: Show what an apply would change, without applying it
    silent: true
    cmds:
      - task: _require-profile
      - helmfile diff

  teardown:
    desc: Destroy EVERYTHING - BMC and the cluster under it (irreversible)
    prompt: This DESTROYS the cluster and every volume, world and database in it. Continue?
    silent: true
    cmds:
      - task: _require-profile
      - |
        # Order matters: Kubernetes-created load balancers leave ENIs that hang
        # subnet deletion. Removing the releases first lets them be cleaned up.
        echo "==========================================" 
        echo "1/5  Removing BMC (releases the load balancers)"
        echo "=========================================="
        helmfile destroy || echo "  (nothing installed, or cluster already gone)"
      - |
        echo ""
        echo "=========================================="
        echo "2/5  Deleting persistent volume claims"
        echo "=========================================="
        # Helm leaves StatefulSet PVCs behind and their disks keep billing.
        # Deleting them lets the CSI driver reclaim them while it still can.
        for ns in {{.NAMESPACE}} nfs; do
          PVCS=$(kubectl get pvc -n "$ns" --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "${PVCS:-0}" != "0" ]; then
            echo "  deleting $PVCS PVC(s) in namespace '$ns'"
            kubectl delete pvc --all -n "$ns" --timeout=120s 2>/dev/null || true
          fi
        done
        for ns in {{.NAMESPACE}} nfs; do
          kubectl delete namespace "$ns" --timeout=120s 2>/dev/null || true
        done

      - |
        echo ""
        echo "=========================================="
        echo "3/5  Waiting for cloud load balancers to disappear"
        echo "=========================================="
        # Lets the provider release its load balancer ENIs before the VPC goes.
        # Skipped off-cloud, where k3s's own Traefik would wait forever.
        case "{{.PROFILE}}" in
          eks|gke|aks) ;;
          *)
            echo "  no cloud load balancers for profile '{{.PROFILE}}' -- skipping"
            exit 0
            ;;
        esac

        # Cloud-agnostic first: once no LoadBalancer Services remain, the
        # provider has been told to release them. Deletion is asynchronous, so
        # the provider-specific check below confirms it actually happened.
        for i in $(seq 1 60); do
          SVCS=$(kubectl get svc -A --field-selector spec.type=LoadBalancer --no-headers 2>/dev/null | wc -l | tr -d ' ')
          [ "${SVCS:-0}" = "0" ] && break
          echo "  $SVCS LoadBalancer Service(s) still present..."
          sleep 5
        done

        case "{{.PROFILE}}" in
          eks)
            for i in $(seq 1 60); do
              REMAINING=$(aws elbv2 describe-load-balancers \
                --query "length(LoadBalancers[?starts_with(LoadBalancerName, 'k8s-')])" \
                --output text 2>/dev/null || echo 0)
              [ "${REMAINING:-0}" = "0" ] && { echo "  all released"; break; }
              echo "  $REMAINING load balancer(s) still present..."
              sleep 5
            done

            # The controller leaves a shared backend security group Terraform
            # does not know about, which blocks VPC deletion.
            for SG in $(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=k8s-traffic-*" \
              --query 'SecurityGroups[].GroupId' --output text 2>/dev/null); do
              echo "  removing orphaned controller security group $SG"
              aws ec2 delete-security-group --group-id "$SG" 2>/dev/null || \
                echo "    (still in use -- it will be retried by the destroy)"
            done
            ;;
          gke)
            # GKE leaves forwarding rules and target pools behind for a few
            # seconds after the Service goes. Destroying the network under them
            # fails, so wait them out.
            for i in $(seq 1 60); do
              REMAINING=$(gcloud compute forwarding-rules list \
                --format="value(name)" 2>/dev/null | wc -l | tr -d ' ')
              [ "${REMAINING:-0}" = "0" ] && { echo "  all released"; break; }
              echo "  $REMAINING forwarding rule(s) still present..."
              sleep 5
            done
            ;;
          aks)
            # AKS puts Service load balancers and their public IPs in the node
            # resource group, which the cluster delete takes with it. The wait
            # still matters: a public IP that is mid-release when the cluster
            # goes can be orphaned into the subscription with nothing owning it.
            for i in $(seq 1 60); do
              REMAINING=$(kubectl get svc -A --field-selector spec.type=LoadBalancer --no-headers 2>/dev/null | wc -l | tr -d ' ')
              [ "${REMAINING:-0}" = "0" ] && { echo "  all released"; break; }
              echo "  $REMAINING LoadBalancer service(s) still present..."
              sleep 5
            done
            ;;
        esac
      - |
        echo ""
        echo "=========================================="
        echo "4/5  Draining Karpenter nodes"
        echo "=========================================="
        # Karpenter is EKS-only. Without this guard a bare-metal teardown runs
        # AWS CLI queries against whatever account happens to be configured.
        if [ "{{.PROFILE}}" != "eks" ]; then
          echo "  Karpenter is only used on EKS -- skipping"
          exit 0
        fi

        # Karpenter's instances are invisible to Terraform. Deleting the
        # NodePool while the controller still lives is what terminates them.
        if kubectl get nodepools >/dev/null 2>&1; then
          kubectl delete nodepools --all --wait=false 2>/dev/null || true
          echo "  waiting for nodeclaims to drain..."
          for i in $(seq 1 60); do
            LEFT=$(kubectl get nodeclaims --no-headers 2>/dev/null | wc -l | tr -d ' ')
            [ "$LEFT" = "0" ] && break
            sleep 10
          done
          LEFT=$(kubectl get nodeclaims --no-headers 2>/dev/null | wc -l | tr -d ' ')
          if [ "$LEFT" = "0" ]; then
            echo "  all Karpenter nodes drained"
          else
            # Finalizers hold a NodeClaim open when the controller cannot reach
            # the EC2 API. Clearing them lets the destroy proceed; the sweep
            # below is what stops the instances from leaking.
            echo "  ${LEFT} nodeclaim(s) still draining -- clearing finalizers"
            for nc in $(kubectl get nodeclaims -o name 2>/dev/null); do
              kubectl patch "$nc" --type=merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            done
          fi
        else
          echo "  no Karpenter NodePools (or cluster already gone)"
        fi

        # Whatever the cluster reported, make sure nothing tagged for it is left
        # running: an instance that outlives its VPC blocks the subnet delete.
        ORPHANS=$(aws ec2 describe-instances \
          --filters "Name=tag:karpenter.sh/nodepool,Values=*" \
                    "Name=tag:kubernetes.io/cluster/{{.CLUSTER_NAME}},Values=owned" \
                    "Name=instance-state-name,Values=pending,running,stopping,stopped" \
          --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)
        if [ -n "$ORPHANS" ]; then
          echo "  terminating orphaned Karpenter instances: $ORPHANS"
          aws ec2 terminate-instances --instance-ids $ORPHANS >/dev/null 2>&1 || true
          aws ec2 wait instance-terminated --instance-ids $ORPHANS 2>/dev/null || true
          echo "  orphans terminated"
        fi
      - |
        echo ""
        echo "=========================================="
        echo "5/5  Destroying the infrastructure"
        echo "=========================================="
        case "{{.PROFILE}}" in
          baremetal)
            # Ansible built this cluster, so Ansible removes it. k3s owns the
            # uninstall scripts on each node; the playbook also clears
            # Longhorn's disks, which those scripts know nothing about.
            INV={{.ROOT_DIR}}/{{.INFRA_DIR}}/baremetal.inventory.yml
            if [ ! -f "$INV" ]; then
              echo "  No inventory at $INV -- nothing to uninstall."
              exit 0
            fi
            cd {{.ROOT_DIR}}/ansible && ansible-playbook uninstall.yml -i "$INV"
            ;;
          *)
            if [ ! -d "{{.TF_DIR}}" ]; then
              echo "  No infrastructure layer for profile '{{.PROFILE}}' -- nothing to destroy."
              echo "  (this profile's cluster is not provisioned by this repo)"
              exit 0
            fi
            # Same reason as `task cluster`: a teardown can run from a fresh clone.
            cd {{.TF_DIR}} && tofu init -input=false
            cd {{.TF_DIR}} && tofu destroy -auto-approve \
              -var-file={{.ROOT_DIR}}/{{.INFRA_DIR}}/{{.PROFILE}}.tfvars
            ;;
        esac
      - |
        echo ""
        echo "Done. Verify nothing is still billable with:"
        echo "  task teardown:verify"
        case "{{.PROFILE}}" in
          eks|gke|aks)
            echo ""
            echo "The reserved panel and game addresses were released with the"
            echo "infrastructure, so any DNS records pointing at them now resolve"
            echo "to nothing. Rebuilding reserves NEW addresses -- re-point DNS"
            echo "from 'task cluster' before installing again."
            ;;
        esac

  teardown:verify:
    desc: List any cloud resources still running that would incur charges
    silent: true
    cmds:
      - task: _require-profile
      - |
        echo "=========================================="
        echo "Still-billable resources"
        echo "  profile: {{.PROFILE}}"
        echo "=========================================="
        case "{{.PROFILE}}" in
          eks)
            printf "%-24s %s\n" "EKS clusters:"    "$(aws eks list-clusters --query 'clusters' --output text 2>/dev/null)"
            printf "%-24s %s\n" "EC2 instances:"   "$(aws ec2 describe-instances --filters Name=instance-state-name,Values=running,pending --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)"
            printf "%-24s %s\n" "Load balancers:"  "$(aws elbv2 describe-load-balancers --query 'LoadBalancers[].LoadBalancerName' --output text 2>/dev/null)"
            printf "%-24s %s\n" "NAT gateways:"    "$(aws ec2 describe-nat-gateways --filter Name=state,Values=available,pending --query 'NatGateways[].NatGatewayId' --output text 2>/dev/null)"
            printf "%-24s %s\n" "Elastic IPs:"     "$(aws ec2 describe-addresses --query 'Addresses[].AllocationId' --output text 2>/dev/null)"
            printf "%-24s %s\n" "EBS volumes:"     "$(aws ec2 describe-volumes --query 'Volumes[].VolumeId' --output text 2>/dev/null)"
            printf "%-24s %s\n" "EBS snapshots:"   "$(aws ec2 describe-snapshots --owner-ids self --query 'Snapshots[].SnapshotId' --output text 2>/dev/null)"
            printf "%-24s %s\n" "EFS filesystems:" "$(aws efs describe-file-systems --query 'FileSystems[].FileSystemId' --output text 2>/dev/null)"
            echo ""
            echo "NOTE: AWS only, and the CURRENT region only."
            ;;
          gke)
            # Every one of these bills while it exists. Disks and addresses are
            # the ones that outlive a cluster deletion and quietly keep charging.
            printf "%-24s %s\n" "GKE clusters:"     "$(gcloud container clusters list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Compute instances:" "$(gcloud compute instances list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Forwarding rules:" "$(gcloud compute forwarding-rules list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Static addresses:" "$(gcloud compute addresses list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Persistent disks:" "$(gcloud compute disks list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Disk snapshots:"   "$(gcloud compute snapshots list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Cloud NAT:"        "$(gcloud compute routers list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Filestore:"        "$(gcloud filestore instances list --format='value(name)' 2>/dev/null | tr '\n' ' ')"
            echo ""
            echo "NOTE: GCP only, and project '$(gcloud config get-value project 2>/dev/null)'."
            echo "      Pass PROFILE=eks to check AWS instead."
            ;;
          aks)
            # A leftover resource group is the clearest signal a destroy did
            # not finish. The filtered-out groups are Azure's own and free.
            printf "%-24s %s\n" "Resource groups:"  "$(az group list --query "[?name!='NetworkWatcherRG' && !starts_with(name,'DefaultResourceGroup-') && !starts_with(name,'cloud-shell-storage-')].name" --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "AKS clusters:"     "$(az aks list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Virtual machines:" "$(az vm list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Scale sets:"       "$(az vmss list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Public IPs:"       "$(az network public-ip list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Load balancers:"   "$(az network lb list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Managed disks:"    "$(az disk list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            printf "%-24s %s\n" "Disk snapshots:"   "$(az snapshot list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            # Azure Files shares back the ReadWriteMany class, so a storage
            # account outliving the cluster keeps billing for stored data.
            printf "%-24s %s\n" "Storage accounts:" "$(az storage account list --query '[].name' --output tsv 2>/dev/null | tr '\n' ' ')"
            echo ""
            echo "NOTE: Azure only, and subscription '$(az account show --query name --output tsv 2>/dev/null)'."
            echo "      This lists the WHOLE subscription, so anything unrelated to BMC shows too."
            ;;
          *)
            echo "No cloud resources for profile '{{.PROFILE}}'."
            echo "Pass PROFILE=eks, PROFILE=gke or PROFILE=aks to sweep a cloud account."
            ;;
        esac
        echo ""
        echo "Empty on every line means nothing is accruing charges."

  uninstall:
    desc: Remove BMC from the cluster, verifying nothing is left behind
    prompt: This will DELETE the BMC installation in '{{.NAMESPACE}}'. Continue?
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} NAMESPACE={{.NAMESPACE}} {{.SCRIPTS_DIR}}/uninstall.sh

  uninstall:purge:
    desc: Uninstall and also remove the GameServer CRD (deletes ALL GameServers)
    prompt: This DELETES the GameServer CRD, and with it every GameServer in the cluster. Continue?
    silent: true
    cmds:
      - task: _require-profile
      - PROFILE={{.PROFILE}} NAMESPACE={{.NAMESPACE}} {{.SCRIPTS_DIR}}/uninstall.sh --purge

  clean:
    desc: Clean this profile's generated config
    prompt: This will delete your local config file. Continue?
    silent: true
    cmds:
      - task: _require-profile
      - rm -f {{.CONFIG_DIR}}/{{.PROFILE}}.yaml
      - echo "✓ Cleaned generated files"

  test:up:
    desc: Create a throwaway local k3d cluster with RWX storage
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh up"]

  test:build:
    desc: Build panel/manager for this machine's arch and import into the test cluster
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh build"]

  test:install:
    desc: Preflight and install BMC into the local test cluster
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh install"]

  test:status:
    desc: Show what is running in the local test cluster
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh status"]

  test:panel:
    desc: Port-forward the local test panel to http://localhost:8080
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh panel"]

  test:uninstall:
    desc: Run the real uninstall against the test cluster and assert nothing is left
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh uninstall"]

  test:down:
    desc: Delete the local test cluster
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh down"]

  test:all:
    desc: Full local test - create cluster, build, install, report, assert clean uninstall
    silent: true
    cmds: ["{{.SCRIPTS_DIR}}/local-test.sh all"]

  verify:
    desc: Verify prerequisites (no PROFILE reports what every profile shares)
    silent: true
    cmds:
      # No _require-profile: an empty PROFILE reports what every profile needs.
      - PROFILE={{.PROFILE}} {{.SCRIPTS_DIR}}/verify-prerequisites.sh

  help:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list
