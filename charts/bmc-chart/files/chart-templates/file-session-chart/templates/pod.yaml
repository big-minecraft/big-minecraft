apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.fileSession.podName }}
  labels:
    app: file-edit-session
    deployment: {{ .Values.fileSession.deploymentName }}
    session: {{ .Values.fileSession.podName }}
spec:
  restartPolicy: Never
  containers:
    - name: file-editor
      image: alpine:latest
      command: ["/bin/sh", "-c", "sleep infinity"]
      volumeMounts:
        - name: pvc-data
          mountPath: {{ .Values.fileSession.mountPath }}
    - name: sftp
      image: emberstack/sftp:latest
      ports:
        - containerPort: 22
      volumeMounts:
        - name: pvc-data
          mountPath: /home/{{ .Values.sftp.username }}/data
        - name: sftp-config
          mountPath: /app/config/sftp.json
          subPath: sftp.json
    - name: activity-watcher
      image: alpine:latest
      env:
        - name: SESSION_ID
          value: "{{ .Values.activityWatcher.sessionId }}"
        - name: SERVICE_TOKEN
          value: "{{ .Values.activityWatcher.serviceToken }}"
        - name: PANEL_URL
          value: "{{ .Values.activityWatcher.panelUrl }}"
        - name: WATCH_PATH
          value: "{{ .Values.fileSession.mountPath }}"
      command: ["/bin/sh", "/scripts/activity-watcher.sh"]
      volumeMounts:
        - name: pvc-data
          mountPath: {{ .Values.fileSession.mountPath }}
        - name: scripts
          mountPath: /scripts
  volumes:
    - name: pvc-data
      persistentVolumeClaim:
        claimName: {{ .Values.fileSession.pvcName }}
    - name: scripts
      configMap:
        name: {{ .Values.fileSession.podName }}-scripts
    - name: sftp-config
      configMap:
        name: {{ .Values.sftp.podName }}-config
        defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fileSession.podName }}-scripts
data:
  activity-watcher.sh: |
{{ .Files.Get "scripts/activity-watcher.sh" | indent 4 }}
