apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.sftp.podName }}
  labels:
    app: {{ .Values.sftp.podName }}
spec:
  restartPolicy: Never
  containers:
    - name: sftp
      image: emberstack/sftp:latest
      ports:
        - containerPort: 22
      volumeMounts:
        - name: pvc-data
          mountPath: /home/{{ .Values.sftp.username }}/data
        - name: sftp-config
          mountPath: /app/config/sftp.json
          subPath: sftp.json
  volumes:
    - name: pvc-data
      persistentVolumeClaim:
        claimName: {{ .Values.sftp.pvcName }}
    - name: sftp-config
      configMap:
        name: {{ .Values.sftp.podName }}-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.sftp.podName }}-config
data:
  sftp.json: |
    {
      "Global": {
        "Chroot": {
          "Directory": "%h",
          "StartPath": "data"
        }
      },
      "Users": [
        {
          "Username": "{{ .Values.sftp.username }}",
          "Password": "{{ .Values.sftp.password }}",
          "UID": 1001,
          "GID": 1001,
          "Directories": [
            "data"
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.sftp.podName }}-service
  {{- with .Values.global.edge.file.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.global.edge.file.type | default "NodePort" }}
  {{- with .Values.global.edge.file.sourceRanges }}
  # Restrict who can reach SFTP. Applies to LoadBalancer, and to NodePort on
  # clusters whose CNI honours it -- on others, use a node firewall as well.
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    app: {{ .Values.sftp.podName }}
  ports:
    - port: 22
      targetPort: 22
      {{- if eq (.Values.global.edge.file.type | default "NodePort") "NodePort" }}
      # Allocated by the panel. Note there is no range check and no collision
      # detection against the NodePorts the platform chart hardcodes
      # (redis 30079, prometheus 30090 in development).
      nodePort: {{ .Values.sftp.nodePort }}
      {{- end }}
{{- if .Values.global.ingressNginx.sftpPassthrough.enabled }}
---
# Stable, port-named Service for ingress-nginx TCP passthrough.
#
# The tcp-services mapping is keyed by port and written once at install time, so
# the Service it points at must have a name derived from the PORT, not from this
# session or its deployment. The panel assigns a port per deployment and never
# moves it, so "sftp-slot-31400" is always whichever deployment holds 31400.
#
# This exists alongside the session-named Service above; both select the same
# pod. The session-named one stays because the LoadBalancer edge still uses it.
apiVersion: v1
kind: Service
metadata:
  name: sftp-slot-{{ .Values.sftp.nodePort }}
  labels:
    app: {{ .Values.sftp.podName }}
    bmc/sftp-slot: {{ .Values.sftp.nodePort | quote }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.sftp.podName }}
  ports:
    - port: 22
      targetPort: 22
{{- end }}
