apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.sftp.podName }}-service
  {{- with .Values.global.edge.file.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.global.edge.file.type }}
  {{- with .Values.global.edge.file.sourceRanges }}
  # Restrict who can reach SFTP. NodePort honours this only on some CNIs.
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    session: {{ .Values.fileSession.podName }}
  ports:
    - port: 22
      targetPort: 22
      {{- if eq .Values.global.edge.file.type "NodePort" }}
      # Allocated by the panel, with no collision check against the platform
      # chart's hardcoded NodePorts.
      nodePort: {{ .Values.sftp.nodePort }}
      {{- end }}

# Walked one level at a time: an older panel has no ingress.controller, and
# indexing through the nil would fail the whole chart.
{{- $ingress := (.Values.global | default dict).ingress | default dict -}}
{{- $controller := $ingress.controller | default dict -}}
{{- $passthrough := $controller.sftpPassthrough | default dict -}}
{{- if $passthrough.enabled }}
---
# Stable, port-named Service for Traefik TCP passthrough; bmc-chart's routes
# are rendered once at install time. Sits alongside the session-named Service
# above, which the LoadBalancer edge uses; both select the same pod.
apiVersion: v1
kind: Service
metadata:
  name: sftp-slot-{{ .Values.sftp.nodePort }}
  labels:
    app: {{ .Values.sftp.podName }}
    bmc/sftp-slot: {{ .Values.sftp.nodePort | quote }}
spec:
  type: ClusterIP
  selector:
    session: {{ .Values.fileSession.podName }}
  ports:
    - port: 22
      targetPort: 22
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.sftp.podName }}-config
data:
  sftp.json: |
{{ tpl (.Files.Get "data/sftp.json") . | indent 4 }}
