{{- /*
Packs one deployment into a versioned artifact.
*/ -}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.publish.jobName }}
  labels:
    app: artifact-publish
    deployment: {{ .Values.publish.deploymentName }}
    bmc/artifact-version: {{ .Values.publish.version | quote }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: artifact-publish
        deployment: {{ .Values.publish.deploymentName }}
    spec:
      restartPolicy: Never
      {{- if .Values.publish.nodeName }}
      # A ReadWriteOnce volume may already be attached elsewhere by a running
      # instance or an open session. Without this the Job lands on a
      # second node and hangs on multi-attach.
      nodeName: {{ .Values.publish.nodeName | quote }}
      {{- end }}
      containers:
        - name: publish
          image: docker.io/bitnamilegacy/minio-client:2025.7.21-debian-12-r2
          env:
            # MinIO Client writes its config under $HOME, and this image runs as uid 1001
            # with no writable home. Without this, `mc alias set` fails.
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: ARTIFACT_ENDPOINT
              value: {{ .Values.global.artifactStore.endpoint | quote }}
            - name: ARTIFACT_BUCKET
              value: {{ .Values.global.artifactStore.bucket | quote }}
            - name: ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bmc-secrets
                  key: artifactAccessKey
            - name: ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bmc-secrets
                  key: artifactSecretKey
            - name: DEPLOYMENT_NAME
              value: {{ .Values.publish.deploymentName | quote }}
            - name: VERSION
              value: {{ .Values.publish.version | quote }}
            - name: MOUNT_PATH
              value: {{ .Values.publish.mountPath | quote }}
          command: ["/bin/sh", "/scripts/publish.sh"]
          volumeMounts:
            - name: deployment-data
              mountPath: {{ .Values.publish.mountPath }}
              readOnly: true
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: deployment-data
          persistentVolumeClaim:
            claimName: {{ .Values.publish.pvcName }}
            readOnly: true
        - name: scripts
          configMap:
            name: {{ .Values.publish.jobName }}-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.publish.jobName }}-script
data:
  publish.sh: |
{{ .Files.Get "scripts/publish.sh" | indent 4 }}
