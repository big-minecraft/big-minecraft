{{- /*
Packs one deployment into a versioned artifact.

A Job rather than streaming through the panel: server directories run to
hundreds of megabytes, and the panel can otherwise only reach deployment files
by exec-ing into a session pod, so this is also what allows publishing with no
session open.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.publish.jobName }}
  labels:
    app: artifact-publish
    deployment: {{ .Values.publish.deploymentName }}
    bmc/artifact-version: {{ .Values.publish.version | quote }}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: artifact-publish
        deployment: {{ .Values.publish.deploymentName }}
    spec:
      restartPolicy: Never
      {{- if .Values.publish.nodeName }}
      # A ReadWriteOnce volume may already be attached elsewhere by a running
      # instance or an open session, and the scheduler cannot see that -- an EBS
      # PV's node affinity is only zone-wide. Without this the Job lands on a
      # second node and hangs on multi-attach.
      nodeName: {{ .Values.publish.nodeName | quote }}
      {{- end }}
      containers:
        - name: publish
          image: quay.io/minio/mc:latest
          env:
            - name: ARTIFACT_ENDPOINT
              value: {{ .Values.global.artifactStore.endpoint | quote }}
            - name: ARTIFACT_BUCKET
              value: {{ .Values.global.artifactStore.bucket | quote }}
            - name: ARTIFACT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bmc-secrets
                  key: artifactAccessKey
            - name: ARTIFACT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bmc-secrets
                  key: artifactSecretKey
          command:
            - /bin/sh
            - -c
            - |
              set -e

              mc alias set store "$ARTIFACT_ENDPOINT" "$ARTIFACT_ACCESS_KEY" "$ARTIFACT_SECRET_KEY"

              echo "Publishing {{ .Values.publish.deploymentName }} {{ .Values.publish.version }}..."

              # mirror, not tar: this image ships mc and coreutils but no tar.
              # Mirroring also means the version prefix is browsable, and a
              # single changed file does not re-upload the whole deployment.
              mc mirror --overwrite {{ .Values.publish.mountPath }} \
                "store/${ARTIFACT_BUCKET}/deployments/{{ .Values.publish.deploymentName }}/{{ .Values.publish.version }}/"

              echo "Published {{ .Values.publish.version }}"
          volumeMounts:
            - name: deployment-data
              mountPath: {{ .Values.publish.mountPath }}
              readOnly: true
      volumes:
        - name: deployment-data
          persistentVolumeClaim:
            claimName: {{ .Values.publish.pvcName }}
            readOnly: true
