# Configuration for the throwaway local k3d cluster (scripts/local-test.sh).
#
# Committed on purpose: it contains no secrets and describes what k3d provides,
# so `task test:up` works from a clean checkout. It is passed explicitly via
# VALUES_FILE and NEVER replaces values.custom.yaml.

global:
  environment: development

  certManager:
    # No public DNS on k3d, so ACME cannot complete a challenge.
    installClusterIssuer: false
    email: "local@example.invalid"

  panel:
    panelHost: "panel.bmc.local"

  ingress:
    className: "traefik"          # k3s ships Traefik
    host: "panel.bmc.local"
    tls:
      mode: none                  # plain HTTP locally

  edge:
    game:
      # klipper-lb (k3s servicelb) implements LoadBalancer on k3d.
      type: LoadBalancer
      annotations: {}
    file:
      type: NodePort

  storage:
    classes:
      # k3d's built-in local-path is ReadWriteOnce, which is now all the shared
      # class needs: staging is held by one pod, and instances pull artifacts
      # into a pod-local emptyDir. Using it here means the local test exercises
      # the ReadWriteOnce path rather than a friendlier one than production.
      shared:
        name: "local-path"
        accessMode: ReadWriteOnce
      database:
        name: "local-path"
        accessMode: ReadWriteOnce
      # Persistent deployments still need RWX, from the NFS provisioner
      # local-test.sh installs.
      persistent:
        name: "nfs"
        accessMode: ReadWriteMany
    volumeSize:
      persistent: "1Gi"
      scalable: "1Gi"
      proxy: "1Gi"
      process: "1Gi"
      manifests: "1Gi"
      mariaDB: "2Gi"
      mongoDB: "2Gi"

  # Datastores in HA mode, so the local test exercises the operators, the
  # cluster resources and the aliases rather than the single-pod path.
  #
  # This is nine stateful pods plus three operators on one k3d node. Anti-affinity
  # is `preferred`, so they co-schedule happily -- on a single node this protects
  # against pod failure, not node failure, which is the whole node's data anyway.
  #
  # Set these back to single for a lighter run.
  redis:
    mode: ha
    replicas: 3
  mariaDB:
    mode: ha
    replicas: 3
  mongoDB:
    mode: ha
    replicas: 3

  metallb:
    installResources: false       # k3d has its own LoadBalancer controller
