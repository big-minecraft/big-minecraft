{{- /* Skipped entirely when using a managed database. host/port/username
     from global.mariaDB are then used as-is by the panel. */ -}}
{{- if eq .Values.global.mariaDB.mode "ha" }}
{{- /*
The operator owns the pods and their Services. This aliases the name everything
already uses onto the operator's primary Service.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels: { app: mariadb, bmc/db-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-mariadb-primary.{{ .Release.Namespace }}.svc.cluster.local
{{- else if not .Values.global.mariaDB.external }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: mariadb
        image: mariadb:latest
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
              key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
        - name: MARIADB_DATABASE
          value: "bmc"
        - name: MARIADB_ROOT_HOST
          value: "%"
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
          subPath: data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc
      - name: init-script
        configMap:
          name: mariadb-init-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-script
data:
  init.sql: |
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  # ClusterIP by design. Only the panel and manager talk to MariaDB, and they
  # reach it by service DNS via global.mariaDB.host. Exposing 3306 through a
  # LoadBalancer put the database root port on a public address.
  type: ClusterIP
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: [{{ .Values.global.storage.classes.database.accessMode | quote }}]
  storageClassName: {{ .Values.global.storage.classes.database.name }}
  resources:
    requests:
      storage: {{ .Values.global.storage.volumeSize.mariaDB }}
{{- end }}
