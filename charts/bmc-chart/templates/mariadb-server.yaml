# Skipped for a managed database -- the panel uses global.mariaDB as-is.
{{- if eq .Values.global.mariaDB.mode "ha" }}
# The operator owns the pods. This aliases the usual name onto its Service.
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels: { app: mariadb, bmc/db-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-mariadb-primary.{{ .Release.Namespace }}.svc.cluster.local
{{- else if not .Values.global.mariaDB.external }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one replica on an RWO volume, so a rolling
  # replacement would deadlock against the incumbent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      # The image's own user. Started as root the entrypoint re-execs under
      # gosu, which spins forever and never starts the server.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: mariadb
        image: {{ .Values.global.mariaDB.image }}:{{ .Values.global.mariaDB.tag }}
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
              key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
        - name: MARIADB_DATABASE
          value: "bmc"
        - name: MARIADB_ROOT_HOST
          value: "%"
        # healthcheck.sh reads its own credentials, so the probe needs none.
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
          subPath: data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc
      - name: init-script
        configMap:
          name: mariadb-init-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-script
data:
  init.sql: |
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  # ClusterIP by design: only the panel and manager talk to MariaDB, by DNS.
  type: ClusterIP
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: [{{ .Values.global.storage.classes.database.accessMode | quote }}]
  storageClassName: {{ include "bmc.storageClass" (dict "ctx" . "class" "database") }}
  resources:
    requests:
      storage: {{ .Values.global.storage.volumeSize.mariaDB }}
{{- end }}
