{{- /* Skipped entirely when using a managed database. host/port/username
     from global.mariaDB are then used as-is by the panel. */ -}}
{{- if eq .Values.global.mariaDB.mode "ha" }}
{{- /*
The operator owns the pods and their Services. This aliases the name everything
already uses onto the operator's primary Service.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels: { app: mariadb, bmc/db-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-mariadb-primary.{{ .Release.Namespace }}.svc.cluster.local
{{- else if not .Values.global.mariaDB.external }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. These are single-replica
  # Deployments on a ReadWriteOnce volume holding an exclusive lock on the
  # data directory, so RollingUpdate deadlocks: it starts the replacement
  # before retiring the incumbent, the replacement cannot take the lock
  # (mongod exits 100 DBPathInUse; mariadbd refuses the datadir), and the
  # incumbent is never retired because its replacement never goes Ready.
  # Recreate stops the old pod first, which is also the only safe order for
  # a database that must not be mounted twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      # Run as the image's own user (999) rather than root.
      #
      # Both the mongo and mariadb entrypoints drop privileges themselves, via
      # `exec gosu <user> "$BASH_SOURCE" "$@"`, but ONLY when started as root.
      # On this stack that gosu call spins: PID 1 stays `gosu ...` in state R,
      # burning a core, and the server is never exec'd -- so the pod reports
      # 1/1 Running with nothing listening on its port, and the panel's
      # wait-for-datastores init container blocks forever on a port that will
      # never open. Redis is unaffected because its entrypoint execs
      # redis-server directly and never calls gosu.
      #
      # Starting as 999 makes the entrypoint's `[ "$(id -u)" = '0' ]` test
      # false, so it skips gosu and execs the server itself. fsGroup already
      # matched this uid, so the volume ownership is unchanged.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: mariadb
        image: {{ .Values.global.mariaDB.image }}:{{ .Values.global.mariaDB.tag }}
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
              key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
        - name: MARIADB_DATABASE
          value: "bmc"
        - name: MARIADB_ROOT_HOST
          value: "%"
        # See the note on the mongodb probe: a Ready pod whose server is not
        # listening is worse than a failing one, because the Service still
        # publishes an endpoint for it.
        #
        # healthcheck.sh ships in the image and reads its credentials from
        # /var/lib/mysql/.my-healthcheck.cnf, so the probe needs no secret of
        # its own -- `mariadb-admin ping` would fail with "Access denied"
        # here, since the container runs as mysql with no password.
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
          subPath: data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc
      - name: init-script
        configMap:
          name: mariadb-init-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-script
data:
  init.sql: |
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
spec:
  # ClusterIP by design. Only the panel and manager talk to MariaDB, and they
  # reach it by service DNS via global.mariaDB.host. Exposing 3306 through a
  # LoadBalancer put the database root port on a public address.
  type: ClusterIP
  selector:
    app: mariadb
  ports:
  - port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: [{{ .Values.global.storage.classes.database.accessMode | quote }}]
  storageClassName: {{ include "bmc.storageClass" (dict "ctx" . "class" "database") }}
  resources:
    requests:
      storage: {{ .Values.global.storage.volumeSize.mariaDB }}
{{- end }}
