# One IngressRouteTCP per SFTP slot, binding the Traefik entryPoint of the same
# port to that port's sftp-slot Service. The entryPoints are declared in
# helmfile.yaml.gotmpl. Rendered once at install time, because the panel assigns
# a port per deployment and never moves it. Skipped on bare metal, which reaches
# SFTP on a NodePort.
{{- $c := .Values.global.ingress.controller }}
# Offline renders have no cluster to ask, so those scripts pass
# --api-versions traefik.io/v1alpha1.
{{- if and $c.install $c.sftpPassthrough.enabled (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
{{- $min := $c.sftpPassthrough.minPort | int }}
{{- range $i := until ($c.sftpPassthrough.portCount | int) }}
{{- $port := add $min $i }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: sftp-slot-{{ $port }}
  labels:
    {{- include "common.labels" $ | nindent 4 }}
    bmc/sftp-slot: {{ $port | quote }}
spec:
  entryPoints:
    - sftp-{{ $port }}
  routes:
    # SFTP is not TLS: no SNI to match, and the route must carry no TLS section.
    - match: HostSNI(`*`)
      services:
        - name: sftp-slot-{{ $port }}
          port: 22
{{- end }}
{{- end }}
