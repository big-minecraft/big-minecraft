{{- /* Skipped entirely when using a managed database. host/port/username
     from global.mongoDB are then used as-is by the panel. */ -}}
{{- if not .Values.global.mongoDB.external }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bmc-secrets
              key: mongodb-root-password
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  # ClusterIP by design -- see the note on mariadb-service.
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes: [{{ .Values.global.storage.classes.database.accessMode | quote }}]
  storageClassName: {{ .Values.global.storage.classes.database.name }}
  resources:
    requests:
      storage: {{ .Values.global.storage.volumeSize.mongoDB }}
{{- end }}
