# Skipped for a managed database -- the panel uses global.mongoDB as-is.
{{- if eq .Values.global.mongoDB.mode "ha" }}
# The operator owns the pods. This aliases the usual name onto its Service.
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  labels: { app: mongodb, bmc/db-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-mongodb-svc.{{ .Release.Namespace }}.svc.cluster.local
{{- else if not .Values.global.mongoDB.external }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one replica on an RWO volume, so a rolling
  # replacement would deadlock against the incumbent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # The image's own user. Started as root the entrypoint re-execs under
      # gosu, which spins forever and never starts the server.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: mongodb
        image: {{ .Values.global.mongoDB.image }}:{{ .Values.global.mongoDB.tag }}
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mongoDB "kind" "mongodb") }}
              key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mongoDB "kind" "mongodb") }}
        # mongosh first, then the legacy shell: 6.0 dropped `mongo`, 4.4 has
        # no `mongosh`, and mongoDB.tag is configurable.
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - >-
                mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null
                || mongo --quiet --eval 'db.runCommand({ping:1}).ok'
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        # Far more rope than readiness: a slow startup must not become a loop.
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -c
              - >-
                mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null
                || mongo --quiet --eval 'db.runCommand({ping:1}).ok'
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  # ClusterIP by design -- see the note on mariadb-service.
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
spec:
  accessModes: [{{ .Values.global.storage.classes.database.accessMode | quote }}]
  storageClassName: {{ include "bmc.storageClass" (dict "ctx" . "class" "database") }}
  resources:
    requests:
      storage: {{ .Values.global.storage.volumeSize.mongoDB }}
{{- end }}
