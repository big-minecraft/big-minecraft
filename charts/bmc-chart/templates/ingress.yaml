{{- $tls := .Values.global.ingress.tls }}
{{- $issuer := $tls.issuer | default .Values.global.certManager.clusterIssuerName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "common.name" . }}-ingress
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- if eq $tls.mode "cluster-issuer" }}
  annotations:
      cert-manager.io/cluster-issuer: {{ $issuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.global.ingress.className }}
  {{- if ne $tls.mode "none" }}
  tls:
    - hosts:
        - {{ .Values.global.ingress.host }}
      secretName: {{ $tls.secretName | default (printf "%s-tls" (include "common.name" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.global.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: panel-service
                port:
                  number: 80
{{- if and (eq $tls.mode "cluster-issuer") (.Values.global.certManager.installClusterIssuer) (.Capabilities.APIVersions.Has "cert-manager.io/v1/ClusterIssuer") }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer }}
spec:
  acme:
    email: {{ .Values.global.certManager.email }}
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: {{ $issuer }}
    solvers:
    - http01:
        ingress:
          class: {{ .Values.global.ingress.className }}
{{- end }}
