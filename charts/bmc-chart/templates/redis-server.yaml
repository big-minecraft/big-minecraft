# redis-service in every mode: the mode changes what is behind the name.
{{- if .Values.global.redis.external }}
{{- $host := .Values.global.redis.externalHost | required "global.redis.externalHost is required when global.redis.external is true" }}
{{- if regexMatch "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$" $host }}
# ExternalName cannot express an IP, so an IP endpoint needs a ClusterIP Service
# plus a hand-written EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: external-ip }
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.redis.port }}
      targetPort: {{ .Values.global.redis.externalPort }}
      protocol: TCP
      name: redis
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redis-service-external
  labels:
    kubernetes.io/service-name: redis-service
addressType: IPv4
ports:
  - name: redis
    port: {{ .Values.global.redis.externalPort }}
    protocol: TCP
endpoints:
  - addresses: [{{ $host | quote }}]
    conditions: { ready: true }
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: external-name }
spec:
  type: ExternalName
  externalName: {{ $host | quote }}
{{- end }}
{{- else if eq .Values.global.redis.mode "ha" }}
# Aliases the usual name onto the operator's master Service.
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-redis-master.{{ .Release.Namespace }}.svc.cluster.local
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  # Recreate, not RollingUpdate: one replica on an RWO volume, so a rolling
  # replacement would deadlock against the incumbent.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.global.redis.image }}:{{ .Values.global.redis.tag }}
        # grep, not exit status: redis-cli exits 0 while still loading.
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "redis-cli ping | grep -q PONG"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "redis-cli ping | grep -q PONG"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: single }
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      {{- if eq .Values.global.environment "development" }}
      nodePort: 30079
      {{- end }}
  type: {{ ternary "NodePort" "ClusterIP" (eq .Values.global.environment "development") }}
{{- end }}
