{{- /*
The Service is named redis-service in every mode on purpose: the mode changes
what sits behind the name, never the name itself, so anything already resolving
it keeps working.
*/ -}}
{{- if .Values.global.redis.external }}
{{- $host := .Values.global.redis.externalHost | required "global.redis.externalHost is required when global.redis.external is true" }}
{{- if regexMatch "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$" $host }}
{{- /* ExternalName cannot express an IP, so an IP endpoint needs a ClusterIP
Service with a hand-written EndpointSlice. This form can also remap the port. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: external-ip }
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.global.redis.port }}
      targetPort: {{ .Values.global.redis.externalPort }}
      protocol: TCP
      name: redis
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redis-service-external
  labels:
    kubernetes.io/service-name: redis-service
addressType: IPv4
ports:
  - name: redis
    port: {{ .Values.global.redis.externalPort }}
    protocol: TCP
endpoints:
  - addresses: [{{ $host | quote }}]
    conditions: { ready: true }
{{- else }}
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: external-name }
spec:
  type: ExternalName
  externalName: {{ $host | quote }}
{{- end }}
{{- else if eq .Values.global.redis.mode "ha" }}
{{- /*
The operator owns the Redis pods and their Services. This aliases the name
everything already uses onto the operator's master Service, which the operator
repoints on failover -- so a plain single-endpoint client needs no changes.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: ha }
spec:
  type: ExternalName
  externalName: bmc-redis-master.{{ .Release.Namespace }}.svc.cluster.local
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. These are single-replica
  # Deployments on a ReadWriteOnce volume holding an exclusive lock on the
  # data directory, so RollingUpdate deadlocks: it starts the replacement
  # before retiring the incumbent, the replacement cannot take the lock
  # (mongod exits 100 DBPathInUse; mariadbd refuses the datadir), and the
  # incumbent is never retired because its replacement never goes Ready.
  # Recreate stops the old pod first, which is also the only safe order for
  # a database that must not be mounted twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.global.redis.image }}:{{ .Values.global.redis.tag }}
        # No password is configured for the in-cluster Redis, so the probe
        # needs no credentials. grep, not just exit status: redis-cli exits 0
        # while the server is still loading, printing LOADING rather than PONG.
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "redis-cli ping | grep -q PONG"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "redis-cli ping | grep -q PONG"]
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  labels: { app: redis, bmc/redis-mode: single }
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      {{- if eq .Values.global.environment "development" }}
      nodePort: 30079
      {{- end }}
  type: {{ ternary "NodePort" "ClusterIP" (eq .Values.global.environment "development") }}
{{- end }}
