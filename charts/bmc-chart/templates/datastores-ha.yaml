# Anti-affinity is `preferred`, not `required`, so ha also runs on one node.
{{- define "bmc.softAntiAffinity" -}}
podAntiAffinity:
  preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            {{- toYaml .labels | nindent 12 }}
{{- end -}}

{{- if eq .Values.global.redis.mode "ha" }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: bmc-redis
  labels:
    app: bmc-redis
spec:
  clusterSize: {{ .Values.global.redis.replicas }}
  # Omitted, not disabled: the CRD requires an image whenever the block exists.
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.0.15
    imagePullPolicy: IfNotPresent
  # EBS volumes mount root-owned and redis runs as 1000, so it needs an fsGroup.
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "bmc.storageClass" (dict "ctx" $ "class" "database") | quote }}
        resources:
          requests:
            storage: 1Gi
  affinity:
    {{- include "bmc.softAntiAffinity" (dict "labels" (dict "app" "bmc-redis")) | nindent 4 }}
---
# The operator repoints the master Service on failover, so single-endpoint
# clients survive it.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: bmc-redis-sentinel
  labels:
    app: bmc-redis-sentinel
spec:
  clusterSize: 3
  redisSentinelConfig:
    redisReplicationName: bmc-redis
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.0.15
    imagePullPolicy: IfNotPresent
  affinity:
    {{- include "bmc.softAntiAffinity" (dict "labels" (dict "app" "bmc-redis-sentinel")) | nindent 4 }}
{{- end }}

{{- if eq .Values.global.mariaDB.mode "ha" }}
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: bmc-mariadb
  labels:
    app: bmc-mariadb
spec:
  rootPasswordSecretKeyRef:
    name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
    key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mariaDB "kind" "mariadb") }}
  replicas: {{ .Values.global.mariaDB.replicas }}
  galera:
    enabled: true
    config:
      # Inherits no class, so without this the PVC waits on a cluster default.
      volumeClaimTemplate:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ include "bmc.storageClass" (dict "ctx" $ "class" "database") | quote }}
        resources:
          requests:
            storage: 100Mi
  # On by default, and members then fail the handshake against each other.
  # Off deliberately: pod-to-pod traffic in one namespace.
  tls:
    enabled: false
  storage:
    size: {{ .Values.global.storage.volumeSize.mariaDB }}
    storageClassName: {{ include "bmc.storageClass" (dict "ctx" $ "class" "database") | quote }}
  affinity:
    antiAffinityEnabled: false
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: bmc-mariadb
---
# The operator creates no database implicitly, so it has to be declared.
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: {{ .Values.global.mariaDB.database }}
spec:
  mariaDbRef:
    name: bmc-mariadb
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
{{- end }}

{{- if eq .Values.global.mongoDB.mode "ha" }}
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: bmc-mongodb
  labels:
    app: bmc-mongodb
spec:
  members: {{ .Values.global.mongoDB.replicas }}
  type: ReplicaSet
  version: "6.0.5"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: {{ .Values.global.mongoDB.username }}
      db: admin
      passwordSecretRef:
        name: {{ include "bmc.dbSecret" (dict "db" .Values.global.mongoDB "kind" "mongodb") }}
        key: {{ include "bmc.dbSecretKey" (dict "db" .Values.global.mongoDB "kind" "mongodb") }}
      roles:
        - name: root
          db: admin
      scramCredentialsSecretName: bmc-mongodb-scram
  statefulSet:
    spec:
      # Overriding the operator's own volume names is the only way to set a class.
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: {{ include "bmc.storageClass" (dict "ctx" $ "class" "database") | quote }}
            resources:
              requests:
                storage: {{ .Values.global.storage.volumeSize.mongoDB }}
        - metadata:
            name: logs-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: {{ include "bmc.storageClass" (dict "ctx" $ "class" "database") | quote }}
            resources:
              requests:
                storage: 1Gi
      template:
        spec:
          affinity:
            {{- include "bmc.softAntiAffinity" (dict "labels" (dict "app" "bmc-mongodb-svc")) | nindent 12 }}
{{- end }}
