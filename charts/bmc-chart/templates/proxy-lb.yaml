apiVersion: v1
kind: Service
metadata:
  name: proxy-lb
  labels:
    {{- include "common.labels" . | nindent 4 }}
    app: proxy
  {{- $eips := .Values.global.edge.game.eipAllocations | default list }}
  {{- $subnets := .Values.global.edge.game.subnets | default list }}
  {{- if or .Values.global.edge.game.annotations $eips $subnets }}
  annotations:
    # Force-quoted: annotations must be map[string]string.
    {{- range $key, $value := .Values.global.edge.game.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- if $eips }}
    # AWS ignores spec.loadBalancerIP for an NLB. One allocation per subnet below.
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: {{ join "," $eips | quote }}
    {{- end }}
    {{- if $subnets }}
    service.beta.kubernetes.io/aws-load-balancer-subnets: {{ join "," $subnets | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.global.edge.game.type }}
  # Applied to proxy pods by the GameServer operator, not by any chart here.
  selector:
    kyriji.dev/lb-ready: "true"
  {{- if and (eq .Values.global.edge.game.type "LoadBalancer") .Values.global.edge.game.loadBalancerIP }}
  loadBalancerIP: {{ .Values.global.edge.game.loadBalancerIP | quote }}
  {{- end }}
  {{- with .Values.global.edge.game.sourceRanges }}
  # Not enforced under k3s's servicelb.
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- include "bmc.edgePolicy" (dict "type" .Values.global.edge.game.type "policy" .Values.global.edge.game.externalTrafficPolicy "key" "global.edge.game.externalTrafficPolicy") | nindent 2 }}
  ports:
    - protocol: TCP
      port: {{ .Values.global.edge.game.java.port }}
      targetPort: {{ .Values.global.edge.game.java.port }}
      name: java
    {{- if .Values.global.edge.game.bedrock.enabled }}
    # Mixed TCP+UDP on one Service needs Kubernetes >= 1.26.
    - protocol: UDP
      port: {{ .Values.global.edge.game.bedrock.port }}
      targetPort: {{ .Values.global.edge.game.bedrock.port }}
      name: bedrock
    {{- end }}
