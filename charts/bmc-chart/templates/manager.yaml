apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  labels:
    app: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
  template:
    metadata:
      labels:
        app: manager
    spec:
      serviceAccountName: kubectl-sa
      containers:
      - name: manager
        image: "{{ .Values.images.manager.repository }}:{{ .Values.images.manager.tag }}"
        imagePullPolicy: {{ .Values.images.manager.pullPolicy }}
        env:
          # BMCManager.getNamespace() falls back to a hardcoded "bmc" when this
          # is unset, so a manager deployed elsewhere would reconcile the wrong
          # namespace. Always pass it explicitly.
          - name: KUBERNETES_NAMESPACE
            value: {{ .Release.Namespace | quote }}
          - name: REDIS_HOST
            value: {{ .Values.global.redis.host }}
          - name: REDIS_PORT
            value: {{ .Values.global.redis.port | quote }}
