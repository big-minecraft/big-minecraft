# The runtime Helm charts the panel installs per deployment, shipped here so
# they always match the `.Values.global.*` contract that renders them.
# ConfigMap keys cannot contain "/", so paths are flattened and mapped back by
# items[].path in panel.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.name" . }}-runtime-charts
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/**" }}
  {{ include "bmc.runtimeKey" $path }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
