# BMC Configuration Example -- Azure Kubernetes Service
#
# Created for you by:
#   task config:init PROFILE=aks
#
# The cluster itself comes from the Terraform/OpenTofu layer in terraform/aks/.
# Build that first -- it creates the resource group, network and cluster with
# its autoscaling node pool. The ingress controller is installed by helmfile on
# top. See terraform/aks/README.md.
#
# Configuration is layered, lowest precedence first:
#   1. charts/bmc-chart/values.yaml  -- neutral defaults, do not edit
#   2. profiles/aks.yaml             -- how AKS satisfies the contract
#   3. config/aks.yaml            -- this file: YOUR installation
#
# This file is deliberately SHORT. Everything about AKS as a KIND of cluster --
# storage classes, edge types, ingress class, load balancer annotations --
# already lives in profiles/aks.yaml. Repeating any of it here is how the two
# drift apart later, and a wrong value here silently wins.
#
# Full install:
#   cd terraform/aks && tofu apply
#   az aks get-credentials --resource-group <group> --name <cluster>
#   task preflight PROFILE=aks
#   task secrets:generate
#   task install PROFILE=aks

global:
  environment: production

  certManager:
    # Create the ClusterIssuer? Set false if your cluster already has one.
    installClusterIssuer: true
    clusterIssuerName: "letsencrypt-prod"
    # REQUIRED -- Let's Encrypt sends expiry warnings here.
    email: "your-email@example.com"  # CHANGE THIS

  panel:
    # REQUIRED: domain for the BMC web panel. After installing, point an A
    # record at the ingress load balancer -- Azure hands out an IP, not a
    # hostname, so this is an A record and not a CNAME:
    #   kubectl get svc ingress-nginx-controller -n ingress-nginx \
    #     -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
    panelHost: "panel.example.com"  # CHANGE THIS

  ingress:
    # REQUIRED: must match panel.panelHost, or the certificate will not match.
    host: "panel.example.com"  # CHANGE THIS

  # Who may reach the game edge. Empty is anywhere, which is what a public
  # Minecraft server wants.
  edge:
    game:
      sourceRanges: []
      # Azure honours this when the address is a static public IP in the
      # cluster's node resource group. Empty lets Azure allocate one, which
      # changes if the Service is recreated.
      loadBalancerIP: ""
    file:
      # Not read: file sessions are reached through the ingress controller's
      # TCP passthrough rather than their own load balancer.
      sourceRanges: []

  # Datastores run in-cluster on every profile. Set mode to "ha" for
  # operator-managed clusters (Redis replication with Sentinel, MariaDB
  # Galera, MongoDB replica set); "single" is one pod each.
  # CHOOSE THIS ONCE. Switching later is NOT a migration: the two modes use
  # different storage -- single runs one pod with its own claim, ha runs an
  # operator StatefulSet whose claims Kubernetes never deletes -- and the
  # Service name stays the same in both. The panel therefore reconnects to an
  # EMPTY database while the old volumes sit unreferenced, still reserving
  # disk. Moving data between modes means a manual dump and restore.
  #
  # ha wants at least three nodes so quorum members do not share a failure
  # domain. terraform/aks leaves node_zones empty by default, so set it there
  # first if you want those members in separate zones.
  redis:
    mode: single
  mariaDB:
    mode: single
  mongoDB:
    mode: single

  fileEditSession:
    # Sessions cost nothing extra here (no load balancer per session), so this
    # is purely about how long an idle session stays open.
    timeoutMinutes: 15
