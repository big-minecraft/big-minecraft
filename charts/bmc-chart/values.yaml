# BMC (Big Minecraft) Chart Default Values
#
# Environment-neutral defaults only -- no secrets, nothing cluster-specific.
#
# Precedence, lowest first: this file < profiles/<name>.yaml < config/<profile>.yaml
#
# Install: task config:init, edit config/<profile>.yaml, task secrets:generate,
# task install PROFILE=<profile>

# Override to run a locally built image (see scripts/local-test.sh).
images:
  panel:
    repository: kyrokrypt/bmc-panel
    tag: latest
    pullPolicy: Always
  manager:
    repository: kyrokrypt/bmc-manager
    tag: latest
    pullPolicy: Always

global:
  namespace: bmc
  environment: production

  certManager:
    installClusterIssuer: false
    clusterIssuerName: "letsencrypt-prod"
    # Email must be set in config/<profile>.yaml
    email: ""

  panel:
    # Domains must be set in config/<profile>.yaml
    panelHost: ""
    storagePath: /storage
    inviteCodeExpiryDays: 7

  # Single sign-on. Every field below comes from your identity provider.
  oidc:
    enabled: false
    # Named on the panel's login button, e.g. "authentik".
    displayName: ""
    # Issuer URL, trailing slash included.
    issuer: ""
    clientId: ""
    # From the provider. Keep config/<profile>.yaml out of git.
    clientSecret: ""
    # Space-separated. 'groups' is required by allowedGroup and adminGroup.
    scopes: "openid profile email groups"
    # Group required to sign in; empty admits anyone.
    allowedGroup: ""
    # Group granted panel admin; empty grants it to no one.
    adminGroup: ""
    # Make an account on first login, no invite needed.
    autoCreateUsers: true
    # Keep password login alongside SSO.
    allowLocalLogin: true

  # The surfaces BMC exposes outside the cluster.
  edge:
    # The game entrypoint; the only surface that must be internet-facing.
    game:
      type: LoadBalancer
      annotations: {}
      # GCP and Azure only; from `task cluster` output.
      loadBalancerIP: ""
      # AWS only. One allocation per subnet.
      eipAllocations: []
      subnets: []
      # Who may reach the game entrypoint; empty is anywhere.
      sourceRanges: []
      # Cluster | Local. Local preserves the player's real IP, but only answers
      # on nodes running a proxy pod.
      externalTrafficPolicy: Cluster
      java:
        port: 25565
      bedrock:
        enabled: true
        port: 19132

    # SFTP / file-edit sessions, created per deployment by the panel.
    file:
      type: NodePort
      annotations: {}
      # Restrict who can reach an open SFTP session (empty = anywhere)
      sourceRanges: []

  ingress:
    className: "traefik"
    # Host must be set in config/<profile>.yaml
    host: ""
    tls:
      # cluster-issuer | existing-secret | none
      mode: cluster-issuer
      # Defaults to certManager.clusterIssuerName
      issuer: ""
      # Used when mode is 'existing-secret'
      secretName: ""

    # Ignored on bare metal, where k3s owns Traefik.
    controller:
      install: false

      # single | ha. Safe to change at any time.
      mode: single
      # Read only when mode is 'ha'.
      replicas: 3

      service:
        annotations: {}

        # Reserved by the Terraform layer, so DNS can be pointed before install.
        # GCP and Azure only; from `task cluster` output.
        loadBalancerIP: ""
        # AWS only. One allocation per subnet.
        eipAllocations: []
        subnets: []

        # Leave on Cluster.
        externalTrafficPolicy: Cluster

      # Traefik forwards a block of ports straight to the session pods, one
      # fixed port per deployment from minPort upwards.
      # portCount is capped at 48; on EKS sftp_passthrough_port_count must agree.
      sftpPassthrough:
        enabled: false
        minPort: 31400
        portCount: 20

  storage:
    # Empty on purpose: no class name is correct on every cluster. A profile or
    # config names its own; the schema fails the render if one is left empty.
    classes:
      # Shared game data, panel manifests and staging volumes.
      shared:
        name: ""
        accessMode: ReadWriteOnce
      # MariaDB and MongoDB. Single writer each.
      database:
        name: ""
        accessMode: ReadWriteOnce

      # Persistent deployments only. Must be ReadWriteMany.
      persistent:
        name: ""
        accessMode: ReadWriteMany
    # false skips ReadWriteMany entirely.
    persistentDeployments: true

    volumeSize:
      persistent: "10Gi"
      scalable: "5Gi"
      proxy: "5Gi"
      process: "2Gi"
      manifests: "1Gi"
      mariaDB: "5Gi"
      mongoDB: "5Gi"

  # Object storage for deployment artifacts. `install` runs MinIO in-cluster.
  artifactStore:
    enabled: true
    install: true
    # Leave empty when install is true; else an S3 or GCS endpoint.
    endpoint: ""
    bucket: "bmc-artifacts"
    region: "us-east-1"
    # MinIO's backing volume; only read when install is true.
    size: "20Gi"

  # In-cluster NFS server providing the ReadWriteMany class. One pod serves
  # every deployment, so mounts hang while it restarts.
  nfsServer:
    install: false
    # Wants ReadWriteOnce block storage; empty uses the cluster default.
    backingStorageClass: ""
    size: "100Gi"
    # Point storage.classes.shared.name at this.
    storageClassName: "nfs"

  redis:
    # Image for mode: single.
    image: redis
    tag: "latest"
    # single: one pod, no failover. ha: Sentinel replication via the operator.
    mode: single
    # Read only when mode is 'ha'.
    replicas: 3

    # What everything connects to, in every mode.
    host: "redis-service"
    port: 6379

    # Point at a Redis you run yourself.
    external: false
    externalHost: ""
    externalPort: 6379

  mariaDB:
    # Image for mode: single. Pin this -- a major-version jump under an
    # initialised datadir is not migrated for you. e.g. tag: "11.4" (LTS)
    image: mariadb
    tag: "latest"
    # single: one pod. ha: Galera via mariadb-operator, needs 3+ nodes.
    mode: single
    # Read only when mode is 'ha'. Keep it odd.
    replicas: 3

    host: mariadb-service
    port: 3306
    username: root
    database: bmc

    # Point at a database you run yourself.
    external: false

    # Set only for a database neither `task secrets:generate` nor the operator made.
    existingSecret: ""
    passwordKey: ""

  mongoDB:
    # 4.4 because MongoDB 5.0+ needs AVX and dies with SIGILL without it.
    # If `grep -w avx /proc/cpuinfo` hits, prefer tag: "8.0".
    image: mongo
    tag: "4.4"
    # single: one pod. ha: replica set via the MongoDB Community Operator.
    mode: single
    # Read only when mode is 'ha'. Keep it odd.
    replicas: 3

    host: mongodb-service
    port: 27017
    username: admin
    database: admin

    external: false

    # Used verbatim when non-empty. A replica set needs this.
    uri: ""

    existingSecret: ""
    passwordKey: ""

  prometheus:
    host: prometheus-service
    port: 9090

  sftp:
    # Password stored in secret 'bmc-secrets' key 'sftp-password'
    enabled: true

  fileEditSession:
    timeoutMinutes: 15
