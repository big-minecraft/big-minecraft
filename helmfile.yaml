environments:
  default:
    values:
      - charts/bmc-chart/values.yaml        # Base defaults
      - charts/bmc-chart/values.auto.yaml   # Auto-detected (generated by task detect)
      - charts/bmc-chart/values.custom.yaml # User configuration (required)
---
repositories:
  - name: metallb
    url: https://metallb.github.io/metallb
  - name: jetstack
    url: https://charts.jetstack.io
  - name: traefik
    url: https://traefik.github.io/charts
---
releases:
  - name: traefik
    namespace: traefik
    createNamespace: true
    chart: traefik/traefik
    version: 28.3.0
    installed: false
  - name: metallb
    namespace: metallb-system
    createNamespace: true
    chart: metallb/metallb
    version: 0.14.9
    installed: true
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - delete
          - crd
          - bfdprofiles.metallb.io,bgpadvertisements.metallb.io,bgppeers.metallb.io,ipaddresspools.metallb.io,l2advertisements.metallb.io
          - --ignore-not-found=true

  - name: cert-manager
    namespace: cert-manager
    createNamespace: true
    chart: jetstack/cert-manager
    version: v1.12.0
    installed: true
    set:
      - name: installCRDs
        value: true
      - name: startupapicheck.enabled
        value: false

  - name: big-minecraft
    namespace: {{ .Values.global.namespace }}
    createNamespace: true
    chart: ./charts/bmc-chart
    values:
      - charts/bmc-chart/values.yaml
      - charts/bmc-chart/values.auto.yaml
      - charts/bmc-chart/values.custom.yaml
    needs:
      - metallb-system/metallb
      - cert-manager/cert-manager