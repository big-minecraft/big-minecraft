# Profile: Google Kubernetes Engine
#
# How GKE satisfies BMC's capability contract. The cluster and its network come
# from terraform/gke/; this profile installs none of it.
#
#   - RWX storage        -> in-cluster NFS server        (see nfsServer below)
#   - RWO storage        -> standard-rwo, built in       (PD CSI, on by default)
#   - LoadBalancer       -> GKE's own service controller (no controller to install)
#   - IngressClass       -> traefik                      (installed by helmfile)
#   - pod egress         -> Cloud NAT, if nodes are private
#
# Verify all of it before installing: task preflight PROFILE=gke
#
# Differs from EKS:
#   - GKE load balancers hand out an IP, so DNS records are A, not CNAME.
#   - Mixed TCP+UDP on one Service needs Kubernetes >= 1.26 and the l4-rbs
#     annotation below. Check Bedrock answers on 19132 after installing.

global:
  edge:
    game:
      type: LoadBalancer
      annotations:
        # The older target-pool implementation cannot carry TCP and UDP at once.
        cloud.google.com/l4-rbs: "enabled"
      sourceRanges: []

    # Reached through Traefik TCP passthrough. See ingress.controller below.
    file:
      type: ClusterIP
      annotations: {}
      # Not read for ClusterIP; access is bounded by the ingress load balancer.
      sourceRanges: []

  storage:
    classes:
      # Staging and artifact-pulling instances: one pod at a time.
      shared:
        name: "standard-rwo"
        accessMode: ReadWriteOnce
      # Ships with GKE, backed by pd-balanced.
      database:
        name: "standard-rwo"
        accessMode: ReadWriteOnce

      # Persistent deployments only, from the in-cluster NFS server.
      persistent:
        name: "nfs"
        accessMode: ReadWriteMany

  # RWX storage, instead of Filestore (1 TiB minimum). Persistent
  # deployments only -- turn both off together.
  nfsServer:
    install: true
    backingStorageClass: "standard-rwo"
    size: "100Gi"
    storageClassName: "nfs"


  # Traefik plus cert-manager. GKE's own ingress terminates TLS with a
  # Google-managed certificate, so it does not fit cluster-issuer mode.
  ingress:
    className: "traefik"
    tls:
      mode: cluster-issuer

    controller:
      install: true

      # Replaces the per-session load balancer; see edge.file above.
      sftpPassthrough:
        enabled: true
        minPort: 31400
        portCount: 25

      service:
        annotations:
          # Same backend-service L4 load balancer as the game edge.
          cloud.google.com/l4-rbs: "enabled"
