# Profile: Amazon EKS
#
# How EKS satisfies the capability contract. The cluster and everything under
# it comes from terraform/eks/; this profile installs none of it.
#
#   - RWX storage        -> EFS + aws-efs-csi-driver      (storage class below)
#   - RWO storage        -> EBS + aws-ebs-csi-driver      (storage class below)
#   - LoadBalancer       -> AWS Load Balancer Controller  (annotations below)
#   - IngressClass       -> traefik                       (see ingress below)
#   - pod egress         -> NAT gateway, if nodes are in private subnets
#
# Verify all of it before installing: task preflight PROFILE=eks
#
# Watch out for:
#   - The AWS Load Balancer Controller is required; the in-tree provider cannot
#     do UDP, so Bedrock silently fails. Needs Kubernetes >= 1.26.
#   - EFS needs the driver's access-point mode, or PVCs sit Pending forever.
#   - Private node subnets need a NAT gateway for pod egress.

global:
  edge:
    # One internet-facing NLB for the game entrypoint.
    game:
      type: LoadBalancer
      annotations:
        # "external" selects the AWS Load Balancer Controller; without it, no UDP.
        service.beta.kubernetes.io/aws-load-balancer-type: "external"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        # Required: without it, AZs with no game pod still publish an IP.
        service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
      # AWS ignores this; Elastic IPs come from Terraform instead.
      loadBalancerIP: ""
      sourceRanges: []

    # SFTP / file-edit sessions. ClusterIP, not a per-session NLB: Traefik
    # forwards the port straight through. See sftpPassthrough below.
    file:
      type: ClusterIP
      annotations: {}
      # Not read for ClusterIP; the ingress LB security group controls access.
      sourceRanges: []

  storage:
    classes:
      # Created by Terraform. An empty name selects the cluster default,
      # which on EKS is RWO-only EBS.
      shared:
        name: "gp3"
        accessMode: ReadWriteOnce
      # EBS. The class must exist; the CSI driver does not create one.
      database:
        name: "gp3"
        accessMode: ReadWriteOnce

      # Persistent deployments only, and the only reason EFS exists.
      persistent:
        name: "efs-sc"
        accessMode: ReadWriteMany


  # Traefik plus cert-manager. An AWS ALB does not fit cluster-issuer mode --
  # it terminates TLS with an ACM certificate, not a Kubernetes Secret.
  ingress:
    className: "traefik"
    tls:
      mode: cluster-issuer

    # Installed by helmfile, after Terraform's load balancer controller.
    controller:
      install: true

      # Replaces the per-session load balancer; see edge.file above.
      sftpPassthrough:
        enabled: true
        minPort: 31400
        portCount: 25

      service:
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "external"
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
          # Terraform-managed: 80/443 must stay open for HTTP-01, the SFTP
          # ports must not. Matches ingress_lb_security_group_name in terraform/.
          service.beta.kubernetes.io/aws-load-balancer-security-groups: "bmc-ingress-lb"
          # Without this, backend traffic is silently not allowed.
          service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
          # Replicas may not cover every AZ the load balancer fronts.
          service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
