# Profile: Azure Kubernetes Service
#
# How AKS satisfies BMC's capability contract. The cluster and its network come
# from terraform/aks/; this profile installs none of it.
#
#   - RWX storage        -> azurefile-csi, built in      (Azure Files, SMB)
#   - RWO storage        -> managed-csi, built in        (Azure Disk CSI)
#   - LoadBalancer       -> AKS's own service controller (no controller to install)
#   - IngressClass       -> traefik                      (installed by helmfile)
#   - pod egress         -> outbound through the standard load balancer
#
# Verify all of it before installing: task preflight PROFILE=aks
#
# Differs from the other cloud profiles:
#   - RWX comes from Azure Files, billed for what you use. It is SMB, so locking
#     and permissions are emulated; switch to nfsServer if that bites.
#   - Azure load balancers hand out an IP, so DNS records are A, not CNAME.
#   - Mixed TCP+UDP on one Service needs Kubernetes >= 1.26 and the standard LB
#     SKU terraform/aks sets. Check Bedrock answers on 19132 after installing.

global:
  edge:
    game:
      type: LoadBalancer
      annotations: {}
      sourceRanges: []

    # Reached through Traefik TCP passthrough. See ingress.controller below.
    file:
      type: ClusterIP
      annotations: {}
      # Not read for ClusterIP; access is bounded by the ingress load balancer.
      sourceRanges: []

  storage:
    classes:
      # Azure Disk, built into AKS.
      shared:
        name: "managed-csi"
        accessMode: ReadWriteOnce
      database:
        name: "managed-csi"
        accessMode: ReadWriteOnce

      # Persistent deployments only; Azure Files is the native RWX here.
      persistent:
        name: "azurefile-csi"
        accessMode: ReadWriteMany

  # Not needed: azurefile-csi already provides ReadWriteMany.
  nfsServer:
    install: false


  # Traefik plus cert-manager. Azure's Application Gateway ingress has its own
  # certificate model and does not fit cluster-issuer mode.
  ingress:
    className: "traefik"
    tls:
      mode: cluster-issuer

    controller:
      install: true

      # Replaces the per-session load balancer; see edge.file above.
      sftpPassthrough:
        enabled: true
        minPort: 31400
        portCount: 25

      service:
        annotations:
          # AKS probes the first port, here raw TCP passthrough. Without this
          # every node is marked unhealthy.
          service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/ping"
