apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- toYaml .Values.capacityTypes | nindent 12 }}
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            {{- toYaml .Values.instanceCategories | nindent 12 }}
        # Minecraft is single-threaded per server and latency-sensitive, so
        # newer generations (faster cores) matter more than core count.
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        # Anything smaller cannot hold a game server plus the daemonsets.
        - key: karpenter.k8s.aws/instance-cpu
          operator: Gt
          values: ["2"]

      # A node is replaced when it reaches this age, which is what keeps AMIs
      # patched. It is also a planned disruption: nodes drain, so game servers
      # on them restart. Set to "Never" to opt out entirely and patch by hand.
      expireAfter: {{ .Values.expireAfter | quote }}

  limits:
    cpu: {{ .Values.cpuLimit | quote }}

  disruption:
    # WhenEmpty, NOT WhenEmptyOrUnderutilized.
    #
    # Underutilized-consolidation actively evicts running pods to pack nodes
    # tighter. On this workload that means terminating live Minecraft servers
    # with players connected, to save an instance-hour.
    #
    # The usual escape hatch is the karpenter.sh/do-not-disrupt annotation on
    # the pods that must not move -- but the GameServer CRD exposes no
    # annotations or podAnnotations field, so the chart cannot set it on game
    # pods today. Until bmc-manager grows that passthrough, the only safe
    # setting is the conservative one: reclaim nodes only once they are empty.
    consolidationPolicy: {{ .Values.consolidationPolicy | quote }}
    consolidateAfter: {{ .Values.consolidateAfter | quote }}

    # Never disrupt more than one node at a time, whatever the reason.
    budgets:
      - nodes: "1"
