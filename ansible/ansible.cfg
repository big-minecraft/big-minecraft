[defaults]
inventory = ../config/infrastructure/baremetal.inventory.yml
host_key_checking = False
# Bare-metal runs are long (k3s downloads, Longhorn images). Keep the SSH
# connection alive rather than reconnecting per task.
pipelining = True
# yaml output without community.general, which deprecated its own callback.
result_format = yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
