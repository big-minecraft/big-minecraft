# Control-plane nodes. The first server bootstraps the cluster; any others join it.
---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: _k3s_binary

- name: Bootstrap the first server
  when: inventory_hostname == _first_server
  block:
    # --disable servicelb is not optional. k3s ships Klipper, which also serves
    # Services of type LoadBalancer, and it competes with MetalLB.
    - name: Install k3s (first server)
      ansible.builtin.shell: |
        set -o pipefail
        curl -sfL https://get.k3s.io | \
          {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if k3s_version | default('') else '' }} \
          sh -s - server --disable servicelb \
          {{ '--cluster-init' if (groups['k3s_servers'] | length) > 1 else '' }} \
          --tls-san {{ _api_address }}
      args:
        executable: /bin/bash
      when: not _k3s_binary.stat.exists
      changed_when: true

    - name: Wait for the node token to exist
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 180

    - name: Read the node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: _token_raw

    - name: Publish the token to the other hosts
      ansible.builtin.set_fact:
        k3s_token: "{{ _token_raw.content | b64decode | trim }}"

- name: Share the token with every other host
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[_first_server]['k3s_token'] }}"
  when: inventory_hostname != _first_server

- name: Join the remaining servers
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if k3s_version | default('') else '' }} \
      K3S_TOKEN='{{ k3s_token }}' \
      sh -s - server --disable servicelb \
      --server https://{{ _api_address }}:6443 \
      --tls-san {{ _api_address }}
  args:
    executable: /bin/bash
  when:
    - inventory_hostname != _first_server
    - not _k3s_binary.stat.exists
  changed_when: true

- name: Wait for the k3s service to be running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
