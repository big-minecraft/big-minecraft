# Worker nodes. They carry the game servers and, on a three-node cluster, the datastore quorum members.
---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: _k3s_binary

- name: Take the join token from the first server
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[_first_server]['k3s_token'] }}"

- name: Install k3s (agent)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | \
      {{ ('INSTALL_K3S_VERSION=' ~ k3s_version) if k3s_version | default('') else '' }} \
      K3S_URL='https://{{ _api_address }}:6443' \
      K3S_TOKEN='{{ k3s_token }}' \
      sh -s -
  args:
    executable: /bin/bash
  when: not _k3s_binary.stat.exists
  changed_when: true

- name: Wait for the k3s-agent service to be running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
